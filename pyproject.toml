[project]
name = "ai-assistant-automations"
version = "0.1.0"
description = "Shadow-mode email spine: event-driven personal AI assistant (v1)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "alembic>=1.13,<2",
    # Not used as an ORM/schema layer (migrations are raw SQL via psycopg, per spec 01) —
    # Alembic's own env.py uses SQLAlchemy's engine/connection machinery to run against
    # Postgres. Declared explicitly rather than relying on Alembic's transitive dependency.
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "testcontainers[postgres]>=4,<5",
]
gmail = [
    "google-api-python-client>=2.100,<3",
    "google-auth>=2.23,<3",
    "google-auth-oauthlib>=1.1,<2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adapters*", "core*", "shared*", "storage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
